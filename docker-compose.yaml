services:
  api:
    image: mmirvaliyev/driver_management_api:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: driver_management_api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db;Port=5432;Database=driver_management_db;User Id=postgres;Password=${POSTGRES_PASSWORD}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - JWT__Key=${JWT_KEY}
      - JWT__Issuer=DriverManagement
      - JWT__Audience=DriverManagementUsers
      - Assistant__BaseUrl=http://ollama:11434
      - Assistant__Model=${ASSISTANT_MODEL:-qwen2.5:3b}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - driver-management-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Self-hosted model for the in-app assistant. Internal only — no published port.
  # First run: docker exec driver-management-ollama ollama pull qwen2.5:3b
  ollama:
    image: ollama/ollama:0.12.6
    container_name: driver-management-ollama
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      # Default 4096 tokens is too small for the guides plus chat history; overflow drops the start of the prompt
      - OLLAMA_CONTEXT_LENGTH=16384
    volumes:
      - driver-management-ollama-data:/root/.ollama
    networks:
      - driver-management-network
    # Uncomment on a host with an NVIDIA GPU (needs nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  db:
    image: postgres:17-alpine
    container_name: driver-management-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=driver_management_db
    ports:
      - "5434:5432"
    volumes:
      - driver-management-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - driver-management-network

networks:
  driver-management-network:
    driver: bridge

volumes:
  driver-management-postgresql-data:
  driver-management-ollama-data:
